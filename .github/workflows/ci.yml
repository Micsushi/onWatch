name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, server1, onwatch]
    name: Test trusted main

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Style
        run: sh scripts/check-gofmt.sh

      - name: Lint
        run: go vet ./...

      - name: Test with coverage
        run: go test -race -parallel 2 -coverprofile=coverage.out -covermode=atomic -count=1 ./...

      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: go build -o onwatch .

  test-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Test public pull request

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Style
        run: sh scripts/check-gofmt.sh

      - name: Lint
        run: go vet ./...

      - name: Test with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic -count=1 ./...

      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: go build -o onwatch .

  menubar-macos:
    runs-on: macos-15
    name: Menubar macOS

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Compile tagged menubar packages
        run: |
          go test -tags menubar ./internal/menubar ./internal/web
          CGO_LDFLAGS="-framework UniformTypeIdentifiers" go build -tags menubar,desktop,production -o /tmp/onwatch-menubar .

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install E2E dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/e2e/requirements.txt
          python -m playwright install chromium

      - name: Run menubar browser tests
        env:
          CGO_LDFLAGS: -framework UniformTypeIdentifiers
          ONWATCH_E2E_GO_BUILD_TAGS: menubar,desktop,production
        run: |
          cd tests/e2e
          pytest tests/test_menubar.py -v
